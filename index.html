<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>The Addis Field Guide Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a two-pane field guide. Left, a filterable index; place details open in a card on the map; right, a street map of Addis
   drawn on the page from OpenStreetMap data (roads, rivers, parks, neighbourhood and street names), with the
   places pinned on top. Phone: map first, index below. */
:root{
  --bg:#f2f4f6; --panel:#ffffff; --ink:#17202a; --muted:#5b6774; --line:#d8dee5;
  --accent:#0f6e6e; --accent-ink:#ffffff;
  --good:#2e8b57; --warn:#a8790a; --bad:#c0392b;
  --shadow:0 6px 24px rgba(23,32,42,.10);
  /* base map */
  --m-land:#eef0ed; --m-park:#d5e8cc; --m-wood:#c8dfbf; --m-cem:#dde4d6; --m-golf:#d3e9c9; --m-stad:#e2e6dc; --m-aero:#e5e7ea;
  --m-water:#b7d4e8; --m-river:#9fc4e0; --m-runway:#cdd2d8;
  --m-minor:#ffffff; --m-minor-case:#d6dbe0; --m-ter:#ffffff; --m-ter-case:#c5ccd3;
  --m-sec:#fdf3d8; --m-sec-case:#dcc68c; --m-pri:#fbe3b3; --m-pri-case:#d3a95c; --m-mw:#f6c9a0; --m-mw-case:#c98f5a;
  --m-rail:#8d98a4; --m-label:#56616d; --m-road-label:#3f4a55; --m-halo:#f5f6f4;
  --display:"Bricolage Grotesque","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131920;--panel:#1b232c;--ink:#e8edf2;--muted:#9aa7b4;--line:#2d3844;
    --accent:#5fc9c0;--accent-ink:#0d1a1a;--good:#5fd08c;--warn:#e0b84a;--bad:#ff7b7b;
    --shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark;
    --m-land:#121a21;--m-park:#17281f;--m-wood:#15251c;--m-cem:#1a231d;--m-golf:#172a1f;--m-stad:#1b2329;--m-aero:#18212a;
    --m-water:#123049;--m-river:#1e4a6b;--m-runway:#2a3440;
    --m-minor:#26313c;--m-minor-case:#0d1318;--m-ter:#2e3a46;--m-ter-case:#0d1318;
    --m-sec:#45432f;--m-sec-case:#0d1318;--m-pri:#5a4c2e;--m-pri-case:#0d1318;--m-mw:#6a4a30;--m-mw-case:#0d1318;
    --m-rail:#56636f;--m-label:#93a0ad;--m-road-label:#a9b4bf;--m-halo:#121a21}
}
:root[data-theme="dark"]{
  --bg:#131920;--panel:#1b232c;--ink:#e8edf2;--muted:#9aa7b4;--line:#2d3844;
  --accent:#5fc9c0;--accent-ink:#0d1a1a;--good:#5fd08c;--warn:#e0b84a;--bad:#ff7b7b;
  --shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark;
  --m-land:#121a21;--m-park:#17281f;--m-wood:#15251c;--m-cem:#1a231d;--m-golf:#172a1f;--m-stad:#1b2329;--m-aero:#18212a;
  --m-water:#123049;--m-river:#1e4a6b;--m-runway:#2a3440;
  --m-minor:#26313c;--m-minor-case:#0d1318;--m-ter:#2e3a46;--m-ter-case:#0d1318;
  --m-sec:#45432f;--m-sec-case:#0d1318;--m-pri:#5a4c2e;--m-pri-case:#0d1318;--m-mw:#6a4a30;--m-mw-case:#0d1318;
  --m-rail:#56636f;--m-label:#93a0ad;--m-road-label:#a9b4bf;--m-halo:#121a21}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
*{box-sizing:border-box}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;min-height:0}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 18px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
header.top .titles{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;min-width:0;flex:1 1 420px}
header.top .credit{flex-basis:100%;color:var(--muted);font-size:12px}
header.top .credit[hidden]{display:none}
header.top h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.4vw,26px);margin:0;letter-spacing:-.01em;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13px}
header.top .sub b{color:var(--ink);font-weight:600}
header.top .links{margin-left:auto;font-size:13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
header.top .links .btn{padding:6px 12px}

.main{display:grid;grid-template-columns:390px minmax(0,1fr);gap:16px;min-height:0;padding-block:12px 10px}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.controls{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px 4px 7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--dot);display:inline-block;flex:none}
.chip .ct{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.chiprow{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.chiprow button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row select{flex:1 1 140px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.row label.cb{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}

.list{overflow:auto;min-height:120px;flex:1 1 0;padding:6px 0}
.item{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:9px 14px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.item:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.item.active{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.item .mk{width:12px;height:12px;border-radius:50%;margin:4px 0 0 4px;background:var(--dot);border:2px solid var(--dot)}
.item .mk.approx{background:transparent;border-style:dashed}
.item .em{font-family:var(--emoji);font-size:16px;line-height:20px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;box-shadow:0 0 0 2px var(--dot) inset}
.item .em.approx{box-shadow:none;border:2px dashed var(--dot)}
.item .nm{font-weight:600;line-height:1.25}
.item .sb{font-size:12px;color:var(--muted)}
.item .rt{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.item .rt b{color:var(--ink);font-weight:500}
.group{padding:10px 14px 4px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--panel);z-index:1}
.group .gm{font-family:var(--emoji);letter-spacing:0;text-transform:none;margin-right:6px}

.detail{display:grid;gap:8px;padding:12px 14px 14px}
/* place card: floats next to the pin on wide screens, docks along the bottom of the map on phones */
.mapwrap .card{position:absolute;left:10px;right:10px;bottom:10px;z-index:1001;max-height:58%;overflow:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.mapwrap .card[hidden]{display:none}
.legend[hidden]{display:none}
.xbtn{margin-left:auto;border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center;flex:none}
a.tel{white-space:nowrap;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.xbtn:hover{background:var(--bg);color:var(--ink)}
.leaflet-popup{position:absolute;text-align:left;margin-bottom:14px}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 32px rgba(23,32,42,.22);overflow:hidden}
.leaflet-popup-content{margin:0;font-size:13px;line-height:1.45;overflow:auto;overscroll-behavior:contain}
.leaflet-popup-tip-container{width:30px;height:15px;position:absolute;left:50%;margin-left:-15px;margin-top:-1px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:14px;height:14px;margin:-8px auto 0;background:var(--panel);border:1px solid var(--line);transform:rotate(45deg)}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .15s linear}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.detail h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0;line-height:1.2;text-wrap:balance}
.detail h2 .em{font-family:var(--emoji);margin-right:6px}
.detail .eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.badge{display:inline-block;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.badge.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.badge.part{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.badge.src{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin:0}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv .mono{font-family:var(--mono);font-size:12.5px}
.detail p{margin:0;font-size:13px}
.detail p.rv{color:var(--muted)}
.detail .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:3px 8px;font-size:11.5px;font-weight:500}
.empty{color:var(--muted);font-size:13px;padding:14px}

.mapwrap{position:relative;min-height:0;min-width:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--m-land)}
#map{position:absolute;inset:0;background:var(--m-land)}
.legend{position:absolute;left:12px;bottom:12px;z-index:900;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:grid;gap:4px;box-shadow:var(--shadow);max-width:min(300px,calc(100% - 24px))}
.legend .li{display:flex;align-items:center;gap:7px}
.legend .sw{width:11px;height:11px;border-radius:50%;background:var(--dot);border:2px solid var(--dot);flex:none}
.legend .sw.approx{background:transparent;border-style:dashed}
.legend .note{color:var(--muted);font-size:11.5px;line-height:1.35;margin-top:2px}
.legend summary{cursor:pointer;font-weight:600;list-style:none}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:" ▾";color:var(--muted)}
.legend details:not([open]) summary::after{content:" ▸"}
.legend .grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-top:6px;max-height:40vh;overflow:auto}
.legend .ty{display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .ty i{font-style:normal;font-family:var(--emoji)}
.status{position:absolute;right:12px;top:12px;z-index:900;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}
.status[hidden]{display:none}

/* pins */
.pin{position:absolute;left:0;top:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px)));cursor:pointer;display:grid;place-items:center;transition:width .12s,height .12s}
.pin.dot{width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pin.dot.approx{background:#fff;border:2.5px dashed var(--c)}
.pin.emo{width:30px;height:30px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 2.5px var(--c),0 2px 5px rgba(0,0,0,.3)}
.pin.emo i{font-style:normal;font-family:var(--emoji);font-size:17px;line-height:1}
.pin.emo.approx{box-shadow:0 2px 5px rgba(0,0,0,.25);border:2.5px dashed var(--c)}
.pin.sel{z-index:2}
.pin.dot.sel{width:20px;height:20px;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 40%,transparent),0 2px 6px rgba(0,0,0,.4)}
.pin.emo.sel{width:40px;height:40px;box-shadow:0 0 0 3.5px var(--c),0 0 0 8px color-mix(in srgb,var(--c) 30%,transparent),0 3px 8px rgba(0,0,0,.35)}
.pin.emo.sel i{font-size:23px}
.zl .pin.emo{width:12px;height:12px;background:var(--c);box-shadow:0 0 0 1.5px #fff,0 1px 3px rgba(0,0,0,.35)}
.zl .pin.emo i{display:none}
.zl .pin.emo.approx{background:#fff;border:2px dashed var(--c);box-shadow:none}
.zm .pin.emo{width:23px;height:23px}
.zm .pin.emo i{font-size:13px}
.zl .pin.emo.sel{width:30px;height:30px;background:var(--panel)}
.zl .pin.emo.sel i{display:block;font-size:17px}

/* Leaflet essentials (the library's stylesheet must be inlined here) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:var(--body);font-size:13px;outline-offset:1px}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}
.leaflet-marker-icon,.leaflet-marker-shadow{display:block}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-pan-anim .leaflet-tile,.leaflet-zoom-anim .leaflet-tile{transition:none}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive,.leaflet-dragging .leaflet-marker-draggable{cursor:grabbing}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:visiblePainted;pointer-events:auto}
.leaflet-marker-icon{overflow:visible}
.leaflet-bar{box-shadow:var(--shadow);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.leaflet-bar a{background-color:var(--panel);border-bottom:1px solid var(--line);width:30px;height:30px;line-height:30px;display:block;text-align:center;text-decoration:none;color:var(--ink);font:600 18px/30px var(--body)}
.leaflet-bar a:hover,.leaflet-bar a:focus{background-color:var(--bg)}
.leaflet-bar a:last-child{border-bottom:none}
.leaflet-bar a.leaflet-disabled{cursor:default;color:var(--muted);opacity:.5}
.leaflet-control-scale-line{border:2px solid var(--m-label);border-top:none;line-height:1.1;padding:2px 5px 1px;white-space:nowrap;background:color-mix(in srgb,var(--panel) 75%,transparent);color:var(--ink);font-size:11px;font-family:var(--mono)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--muted);font-size:10.5px;padding:1px 6px;border-radius:6px 0 0 0;margin:0!important}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-tooltip{position:absolute;padding:4px 8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ink);white-space:nowrap;user-select:none;pointer-events:none;box-shadow:var(--shadow);font-weight:600;font-size:12.5px}
.leaflet-tooltip-top:before{position:absolute;pointer-events:none;border:6px solid transparent;background:transparent;content:"";left:50%;margin-left:-6px;bottom:0;margin-bottom:-12px;border-top-color:var(--panel)}
.leaflet-tooltip-top{margin-top:-8px}
.bm-labels{pointer-events:none}

.foot{padding:2px 0 12px;color:var(--muted);font-size:12.5px;line-height:1.5}
.foot summary{cursor:pointer;color:var(--ink)}
.foot ul{margin:8px 0 0;padding-left:18px;columns:2 320px;column-gap:28px}
.foot li{break-inside:avoid;margin:0 0 4px}
.foot li b{color:var(--ink);font-weight:600}
.foot li i{font-style:normal;font-family:var(--emoji)}
.srcnote{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 14px}
.foot[hidden]{display:none}

@media (max-width:860px){
  .app{height:auto;display:block}
  .main{grid-template-columns:1fr;grid-template-rows:62vh auto}
  .mapwrap{height:62vh;order:0}
  .panel{order:1;max-height:none}
  .list{flex:none;max-height:65vh}
  .legend .grid{grid-template-columns:1fr}
  .legend{left:auto;right:10px;top:10px;bottom:auto;max-width:min(240px,calc(100% - 70px))}
  .status{right:auto;left:56px;top:10px}
}
@media (prefers-reduced-motion:reduce){
  .leaflet-zoom-anim .leaflet-zoom-animated{transition:none}
  .pin{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="titles">
      <h1 id="title"></h1>
      <div class="sub" id="subtitle"></div>
      <div class="credit" id="credit"></div>
    </div>
    <nav class="links" id="links"></nav>
  </header>

  <div class="main">
    <section class="panel" aria-label="Place index">
      <div class="controls">
        <input class="search" id="q" type="search" autocomplete="off" aria-label="Search places">
        <div class="chips" id="chips"></div>
        <div class="chiprow" id="chiprow"><button type="button" id="allOn">Show all</button><button type="button" id="allOff">Hide all</button></div>
        <div class="row">
          <select id="sub" aria-label="Type"></select>
          <select id="minr" aria-label="Minimum Google rating">
            <option value="0">Any rating</option>
            <option value="4">4.0 and up</option>
            <option value="4.3">4.3 and up</option>
            <option value="4.5">4.5 and up</option>
          </select>
          <select id="srcSel" aria-label="Source" hidden></select>
        </div>
        <div class="row">
          <label class="cb"><input type="checkbox" id="hideApprox"> <span id="hideApproxLabel">Show exact locations only</span></label>
          <span class="count" id="countLine"></span>
        </div>
      </div>
      <div class="list" id="list" role="listbox" aria-label="Places"></div>
    </section>

    <section class="mapwrap" aria-label="Map">
      <div id="map" role="application" aria-label="Street map of Addis Ababa with places pinned"></div>

  }

          if (X<0||Y<0||X>size.x||Y>size.y) return;
          var prev = placed[name]; if (prev && prev.some(function(q){ return Math.abs(q[0]-X)+Math.abs(q[1]-Y) < 260; })) return;
          var ang = Math.atan2(by-ay, bx-ax); if (ang > Math.PI/2) ang -= Math.PI; if (ang < -Math.PI/2) ang += Math.PI;
          var hw = tw/2+3, hh = 7, ca = Math.abs(Math.cos(ang)), sa = Math.abs(Math.sin(ang));
          var ex = hw*ca + hh*sa, ey = hw*sa + hh*ca, b = [X-ex, Y-ey, X+ex, Y+ey]; if (hit(b)) return; boxes.push(b);
          (placed[name] || (placed[name]=[])).push([X,Y]);
          ctx.save(); ctx.translate(X,Y); ctx.rotate(ang); ctx.strokeStyle = STY.halo; ctx.lineWidth = 3; ctx.strokeText(name,0,0); ctx.fillStyle = STY['road-label']; ctx.fillText(name,0,0); ctx.restore();
        });
      }
    }
  });
  var labels = new LabelLayer();
  var statusEl = document.getElementById('bmStatus');
  function loadJSON(u){ return fetch(u).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }); }
  loadJSON('base-major.json').then(function(d){
    BM.names = d.names; BM.places = d.places; addFeats(d.f, d.meta.o, d.meta.q); BM.majorLoaded = true;
    base.addTo(map); labels.addTo(map); statusEl.textContent = 'Loading side streets…';
    return loadJSON('base-minor.json').then(function(m){ addFeats(m.f, m.meta.o, m.meta.q); BM.minorLoaded = true; base.redraw(); labels.redraw(); statusEl.hidden = true; });
  }).catch(function(){ statusEl.textContent = BM.majorLoaded ? 'Side streets could not load' : 'Street map could not load; pins still work'; });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ labels.redraw(); });

  // ================= places =================
  var layer = L.layerGroup().addTo(map);
  var markers = {};
  P.forEach(function(p, i){ p.i = i; p.approx = !!p.ap; });
  (function(){
    var spots = {};
    P.forEach(function(p){ var k = p.la.toFixed(4)+','+p.ln.toFixed(4); (spots[k]||(spots[k]=[])).push(p); });
    Object.keys(spots).forEach(function(k){ var a = spots[k]; if (a.length < 2) return;
      var r = EMOJI ? 12 + 3*a.length : 7 + 2*a.length;
      a.forEach(function(p, j){ var t = 2*Math.PI*j/a.length - Math.PI/2; p.dx = Math.round(r*Math.cos(t)); p.dy = Math.round(r*Math.sin(t)); });
    });
  })();
  function pinHtml(p, sel){
    var cls = 'pin ' + (EMOJI ? 'emo' : 'dot') + (p.approx ? ' approx' : '') + (sel ? ' sel' : '');
    var st = '--c:var(--g-'+p.g+');' + (p.dx ? '--dx:'+p.dx+'px;--dy:'+p.dy+'px' : '');
    return '<span class="'+cls+'" style="'+st+'">' + (EMOJI ? '<i>'+esc(p.e)+'</i>' : '') + '</span>';
  }
  P.forEach(function(p){
    var m = L.marker([p.la,p.ln], {icon: L.divIcon({className:'', html: pinHtml(p,false), iconSize:[0,0]}), keyboard:false, riseOnHover:true});
    m.bindTooltip((EMOJI ? esc(p.e)+' ' : '') + esc(p.n), {direction:'top', offset:[p.dx||0, (p.dy||0) - (EMOJI?16:9)]});
    m.on('click', function(){ select(p.i, false); });
    markers[p.i] = m;
  });
  function zoomClass(){ var z = map.getZoom(), el = map.getContainer(); el.classList.toggle('zl', z < 13); el.classList.toggle('zm', z >= 13 && z < 14.5); }
  map.on('zoomend', zoomClass); zoomClass();

  // ================= filters =================
  var counts = {}; P.forEach(function(p){ counts[p.g] = (counts[p.g]||0) + 1; });
  var state = {q:'', cats:{}, sub:'', minr:0, hideApprox:false, src:'', sel:null};
  C.groups.forEach(function(g){ state.cats[g.k] = true; });
  var chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = C.groups.filter(function(g){ return counts[g.k]; }).map(function(g){
    return '<button class="chip" type="button" data-cat="'+g.k+'" aria-pressed="true" style="--dot:var(--g-'+g.k+')"><span class="dot"></span>'+esc(g.label)+' <span class="ct">'+counts[g.k]+'</span></button>'; }).join('');
  if (C.groups.filter(function(g){ return counts[g.k]; }).length < 5) document.getElementById('chiprow').hidden = true;
  var subSel = document.getElementById('sub');
  function fillSubs(){
    var cur = subSel.value; var seen = {}; var opts = [];
    P.forEach(function(p){ if (!state.cats[p.g]) return; (p.ss || [p.s]).forEach(function(s){ if (!seen[s]) { seen[s]=1; opts.push({s:s, g:p.g, e:p.e}); } }); });
    opts.sort(function(a,b){ return C.groups.indexOf(GK[a.g]) - C.groups.indexOf(GK[b.g]) || a.s.localeCompare(b.s); });
    subSel.innerHTML = '<option value="">'+esc(C.subLabel || 'All types')+'</option>' + opts.map(function(p){
      return '<option value="'+esc(p.s)+'">'+(EMOJI ? esc(p.e)+' ' : esc(GK[p.g].label)+' · ')+esc(p.s)+'</option>'; }).join('');
    subSel.value = opts.some(function(o){ return o.s===cur; }) ? cur : '';
    state.sub = subSel.value;
  }
  function passes(p){
    if (!state.cats[p.g]) return false;
    if (state.sub && (p.ss ? p.ss.indexOf(state.sub) < 0 : p.s !== state.sub)) return false;
    if (state.hideApprox && p.approx) return false;
    if (state.src && !(p.src === state.src || (state.src !== 'Both' && p.src === 'Both'))) return false;
    if (state.minr > 0 && !(typeof p.r === 'number' && p.r >= state.minr)) return false;
    if (state.q){
      var hay = (p.n+' '+p.s+' '+(p.k||'')+' '+(p.a||'')+' '+(p.sm||'')+' '+(p.no||'')+' '+(p.ls||'')+' '+(p.rv||'')).toLowerCase();
      if (state.q.split(/\s+/).some(function(w){ return w && hay.indexOf(w) < 0; })) return false;
    }
    return true;
  }
  var listEl = document.getElementById('list');
  function render(){
    var shown = P.filter(passes);
    P.forEach(function(p){
      var m = markers[p.i]; var on = passes(p) || state.sel === p.i;
      if (on && !layer.hasLayer(m)) layer.addLayer(m);
      if (!on && layer.hasLayer(m)) layer.removeLayer(m);
      var el = m.getElement && m.getElement(); if (el && el.firstChild) el.firstChild.classList.toggle('sel', state.sel === p.i);
      m.setZIndexOffset(state.sel === p.i ? 1000 : 0);
    });
    var groups = {}; var order = [];
    shown.forEach(function(p){ var g = p.s; if (!groups[g]) { groups[g] = []; order.push(g); } groups[g].push(p); });
    order.sort(function(a,b){ var pa = groups[a][0], pb = groups[b][0]; return C.groups.indexOf(GK[pa.g]) - C.groups.indexOf(GK[pb.g]) || a.localeCompare(b); });
    var html = '';
    order.forEach(function(g){
      var items = groups[g].slice().sort(function(a,b){ return (typeof b.r==='number'?b.r:-1) - (typeof a.r==='number'?a.r:-1) || a.n.localeCompare(b.n); });
      html += '<div class="group">'+(EMOJI ? '<span class="gm">'+esc(items[0].e)+'</span>' : '')+esc(g)+' <span style="font-weight:400">'+items.length+'</span></div>';
      items.forEach(function(p){
        html += '<button class="item'+(state.sel===p.i?' active':'')+'" role="option" aria-selected="'+(state.sel===p.i)+'" data-i="'+p.i+'" style="--dot:var(--g-'+p.g+')">'
             + (EMOJI ? '<span class="em'+(p.approx?' approx':'')+'">'+esc(p.e)+'</span>' : '<span class="mk'+(p.approx?' approx':'')+'"></span>')
             + '<span><span class="nm">'+esc(p.n)+'</span><br><span class="sb">'+esc(p.k || p.a || p.s)+'</span></span>'
             + '<span class="rt">'+(typeof p.r==='number' ? '<b>'+p.r.toFixed(1)+'</b> · '+esc(p.rc) : (p.approx?'approx.':'no rating'))+'</span>'
             + '</button>';
      });
    });
    listEl.innerHTML = html || '<div class="empty">Nothing matches these filters.</div>';
    document.getElementById('countLine').textContent = shown.length + ' of ' + P.length + ' shown';
  }

  // ================= place card =================
  var card = document.getElementById('card'), legendEl = document.getElementById('legend'), popup = null;
  var docked = window.matchMedia('(max-width:860px)');
  function kv(dt, dd, mono){ return dd ? '<dt>'+dt+'</dt><dd'+(mono?' class="mono"':'')+'>'+dd+'</dd>' : ''; }
  // phone numbers become tap-to-call links; shortened endings ("/ 04") expand from the number before them,
  // 3-4 digit Ethiopian short codes link as they are, and numbers with the wrong length stay plain text
  function phoneHtml(s){
    var prev = null, out = [];
    String(s||'').split('/').forEach(function(raw){
      var t = raw.trim(); if (!t) return;
      var m = t.match(/^(.*?)(\s*(?:\(.*\)|ext\.?\s*\d.*))?$/i), main = (m ? m[1] : t).trim(), tail = (m && m[2]) || '';
      var d = main.replace(/\D/g, ''), tel = null;
      if (main.charAt(0) === '+') {
        if ((d.indexOf('251') === 0 && d.length === 12) || (d.charAt(0) === '1' && d.length === 11)) { tel = '+' + d; prev = d; } else prev = null;
      } else if (/^\d+$/.test(main.replace(/\s/g, ''))) {
        if (d.length <= 3 && prev && d.length >= 2) tel = '+' + prev.slice(0, prev.length - d.length) + d;
        else if (d.length === 4 && prev && prev.indexOf('2511') === 0) tel = '+' + prev.slice(0, prev.length - 4) + d;
        else if (d.length === 4) tel = d;
      }
      out.push(tel ? '<a class="tel" href="tel:'+tel+'" title="Call '+tel+'">'+esc(main)+'</a>'+esc(tail) : esc(t));
    });
    return out.join(' / ');
  }
  function copyBtn(text){ return '<button class="btn small" type="button" data-copy="'+esc(text)+'">Copy</button>'; }
  function cardHtml(p){
    var g = GK[p.g];
    var stars = typeof p.r==='number' ? '<span class="mono">'+p.r.toFixed(1)+'</span> on Google from '+esc(p.rc)+' reviews'+(p.p?' · '+esc(p.p):'') : 'No Google rating';
    return '<div class="detail">'
      + '<div class="eyebrow"><span style="color:var(--g-'+p.g+');font-weight:600">'+esc(g.label)+'</span><span>·</span><span>'+esc(p.s)+'</span>'
      + '<button class="xbtn" type="button" data-close="1" aria-label="Close details">×</button></div>'
      + '<h2>'+(EMOJI ? '<span class="em">'+esc(p.e)+'</span>' : '')+esc(p.n)+'</h2>'
      + '<div class="eyebrow"><span class="badge '+(p.approx?'part':'ok')+'">'+(p.approx ? (p.st==='Unverified' ? 'Unconfirmed location' : 'Approximate location') : 'Exact location')+'</span>'
      + (p.src ? '<span class="badge src">'+esc(srcLabel(p.src))+'</span>' : '') + '</div>'
      + (p.k ? '<p><i>'+esc(C.knownLabel || 'Known for')+':</i> '+esc(p.k)+'</p>' : '')
      + '<p>'+stars+'</p>'
      + '<dl class="kv">'
      + kv('Where', esc(p.a))
      + kv('Hours', esc(p.h))
      + kv(C.daysLabel || 'Open days', esc(p.d))
      + kv(C.phoneLabel || 'Phone', p.ph ? phoneHtml(p.ph)+' '+copyBtn(p.ph) : '', true)
      + kv('Phone (Google)', p.gph ? phoneHtml(p.gph)+' '+copyBtn(p.gph) : '', true)
      + kv('Listed in', esc(p.ls))
      + '</dl>'
      + (p.sm ? '<p>'+esc(p.sm)+'</p>' : '')
      + (p.rv ? '<p class="rv"><b>Reviews:</b> '+esc(p.rv)+'</p>' : '')
      + (p.no ? '<p class="rv"><b>Note:</b> '+esc(p.no)+'</p>' : '')
      + '<div class="actions"><a class="btn primary" href="'+esc(p.u)+'" target="_blank" rel="noopener">Open in Google Maps</a>'
      + '<span class="mono" style="font-size:11.5px;color:var(--muted)">'+p.la.toFixed(5)+', '+p.ln.toFixed(5)+'</span></div>'
      + '</div>';
  }
  function onCardClick(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.close) { closeCard(); return; }
    if (b.dataset.copy) {
      var t = b.dataset.copy;
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ b.textContent='Copied'; setTimeout(function(){ b.textContent='Copy'; }, 1200); })
        .catch(function(){ var r=document.createRange(); r.selectNodeContents(b.previousSibling||b.parentNode); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); });
    }
  }
  card.addEventListener('click', onCardClick);
  function showCard(p){
    if (state.sel !== p.i) return;
    if (docked.matches) {
      if (popup) { var old = popup; popup = null; map.closePopup(old); }
      card.innerHTML = cardHtml(p); card.hidden = false; card.scrollTop = 0; legendEl.hidden = true;
      // keep the pin visible in the strip of map above the card
      var free = map.getSize().y - card.offsetHeight - 10, pt = map.latLngToContainerPoint([p.la,p.ln]);
      if (pt.y > free - 30 || pt.y < 20) map.panBy([0, pt.y - free/2], {animate:true});
      return;
    }
    card.hidden = true; legendEl.hidden = false;
    var mh = map.getSize().y;
    popup = L.popup({maxWidth:380, minWidth:300, maxHeight:Math.max(220, Math.round(mh*0.72)), closeButton:false, autoPan:true,
      autoPanPadding:[24,24], offset:[p.dx||0, (p.dy||0) - (EMOJI ? 20 : 11)]})
      .setLatLng([p.la,p.ln]).setContent(cardHtml(p));
    popup._idx = p.i;
    popup.openOn(map);
    var el = popup.getElement(); if (el) el.addEventListener('click', onCardClick);
    markers[p.i].closeTooltip();
  }
  function closeCard(){
    state.sel = null;
    if (popup) { var old = popup; popup = null; map.closePopup(old); }
    card.hidden = true; legendEl.hidden = false; render();
  }
  map.on('popupclose', function(e){ if (popup && e.popup === popup) { popup = null; if (state.sel === e.popup._idx) { state.sel = null; render(); } } });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && state.sel != null) closeCard(); });
  function select(i, fly){
    state.sel = i; var p = P[i];
    render();
    if (fly !== false) {
      var done = false; var open = function(){ if (!done) { done = true; showCard(p); } };
      map.once('moveend', open); setTimeout(open, 900);
      map.flyTo([p.la,p.ln], Math.max(map.getZoom(), 16), {duration:.6});
    } else showCard(p);
    // picked on the map: scroll only inside the list box, never the page (on phones the list sits below the map)
    if (fly === false) {
      var it = listEl.querySelector('.item.active');
      if (it) { var lr = listEl.getBoundingClientRect(), ir = it.getBoundingClientRect();
        if (ir.top < lr.top + 34) listEl.scrollTop += ir.top - lr.top - 40;
        else if (ir.bottom > lr.bottom) listEl.scrollTop += ir.bottom - lr.bottom + 8; }
    }
    if (docked.matches && fly !== false) document.getElementById('map').scrollIntoView({behavior:'smooth', block:'start'});
  }
  listEl.addEventListener('click', function(e){ var b = e.target.closest('.item'); if (b) select(+b.dataset.i, true); });

  // ================= controls =================
  document.getElementById('q').addEventListener('input', function(e){ state.q = e.target.value.trim().toLowerCase(); render(); });
  chipsEl.addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if (!c) return;
    var on = c.getAttribute('aria-pressed') !== 'true';
    c.setAttribute('aria-pressed', on); state.cats[c.dataset.cat] = on; fillSubs(); render();
  });
  function setAll(on){ chipsEl.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', on); state.cats[c.dataset.cat] = on; }); fillSubs(); render(); }
  document.getElementById('allOn').addEventListener('click', function(){ setAll(true); });
  document.getElementById('allOff').addEventListener('click', function(){ setAll(false); });
  subSel.addEventListener('change', function(){ state.sub = subSel.value; render(); });
  document.getElementById('minr').addEventListener('change', function(e){ state.minr = parseFloat(e.target.value)||0; render(); });
  srcSel.addEventListener('change', function(e){ state.src = e.target.value; render(); });
  document.getElementById('hideApprox').addEventListener('change', function(e){ state.hideApprox = e.target.checked; render(); });

  // legend
  (function(){
    var used = C.groups.filter(function(g){ return counts[g.k]; });
    var html = '';
    if (!P.length) { document.getElementById('legend').hidden = true; return; }
    if (EMOJI) {
      var types = {}; P.forEach(function(p){ if (!types[p.s]) types[p.s] = p; });
      var arr = Object.keys(types).map(function(k){ return types[k]; }).sort(function(a,b){ return C.groups.indexOf(GK[a.g]) - C.groups.indexOf(GK[b.g]) || a.s.localeCompare(b.s); });
      html = '<details><summary>Icon key</summary><div class="grid">' + arr.map(function(p){ return '<span class="ty" style="color:var(--g-'+p.g+')"><i>'+esc(p.e)+'</i><span style="color:var(--ink)">'+esc(p.s)+'</span></span>'; }).join('') + '</div>'
        + '<div class="note">Ring colour shows the category; a dashed ring means the location is approximate. Zoom in to see icons.</div></details>';
    } else {
      html = '<details'+(used.length <= 4 && !window.matchMedia('(max-width:860px)').matches ? ' open' : '')+'><summary>Legend</summary><div style="display:grid;gap:4px;margin-top:6px">'
        + used.map(function(g){ return '<div class="li"><span class="sw" style="--dot:var(--g-'+g.k+')"></span>'+esc(g.label)+'</div>'; }).join('')
        + '<div class="li"><span class="sw approx" style="--dot:var(--m-label)"></span>Dashed: approximate location (host hotel, mall or building)</div>'
        + (C.legendNote ? '<div class="note">'+esc(C.legendNote)+'</div>' : '') + '</div></details>';
    }
    document.getElementById('legend').innerHTML = html;
  })();

  // entries without a map location
  (function(){
    var foot = document.getElementById('foot');
    if (!U.length) { foot.hidden = true; }
    else {
      document.getElementById('footSum').innerHTML = '<b>'+esc(C.unpinnedTitle || 'Contacts and places without a map location')+' ('+U.length+')</b>';
      document.getElementById('unpinned').innerHTML = U.map(function(u){
        return '<li>'+(u.e ? '<i>'+esc(u.e)+'</i> ' : '')+'<b>'+esc(u.n)+'</b> ('+esc(u.s)+')'+(u.ph ? ', <span style="font-family:var(--mono)">'+phoneHtml(u.ph)+'</span>' : '')+(u.no ? '. '+esc(u.no) : '')+'</li>'; }).join('');
    }
    document.getElementById('srcNote').textContent = C.sourceNote || 'Details were checked against Google Maps listings in October 2026; ratings and hours change, so confirm before you go. Street map © OpenStreetMap contributors. Built with Leaflet, Google Sheets, GitHub Pages and Claude.';
  })();

  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function retheme(){ readStyle(); base.redraw(); labels.redraw(); }
  if (mq.addEventListener) mq.addEventListener('change', retheme);
  new MutationObserver(retheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

  fillSubs(); render();
  if (P.length) { try { map.fitBounds(L.latLngBounds(P.map(function(p){ return [p.la,p.ln]; })).pad(0.04)); } catch(e){} }
  window.addEventListener('resize', function(){ map.invalidateSize(); });
  }
})();
</script>
</body>
